<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>173 DE THAM - 3D 인테리어 완공 뷰어</title>
  <link rel="stylesheet" href="./static/css/app.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Header Bar -->
  <header class="top-bar" id="top-bar">
    <div class="brand">
      <span class="badge">3D 인테리어</span>
      <h1>173 ĐỀ THÁM</h1>
    </div>
    <div class="floor-tabs" id="floor-tabs">
      <button class="tab-btn active" data-mode="all">전체 (1F~3F)</button>
      <button class="tab-btn" data-mode="exploded">층별 분리</button>
      <button class="tab-btn" data-mode="1">1층</button>
      <button class="tab-btn" data-mode="2">2층</button>
      <button class="tab-btn" data-mode="3">3층</button>
    </div>
    <div class="camera-presets">
      <button class="cam-btn" data-cam="iso">조감도</button>
      <button class="cam-btn" data-cam="f1_facade">🚪 1F 입구 외관</button>
      <button class="cam-btn" data-cam="f1_walk">🍷 1F 오픈키친 바</button>
      <button class="cam-btn" data-cam="f1_dj">🎧 1F DJ홀</button>
      <button class="cam-btn" data-cam="f2_beer">🛋️ 2F 중앙홀</button>
      <button class="cam-btn" data-cam="f2_vip">🥂 2F VIP홀</button>
    </div>
    <div class="header-actions">
      <button id="btn-header-panel" class="header-action-btn" title="설정 옵션 열기">⚙️ 옵션</button>
      <button id="btn-header-hide-ui" class="header-action-btn" title="전체화면 (UI 숨김)">👁️ UI 숨기기</button>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Left Control Panel -->
  <aside class="control-panel" id="control-panel">
    <div class="panel-header">
      <h3>⚙️ 인테리어 설정 & 옵션</h3>
      <button id="btn-close-panel" class="panel-close-btn" title="닫기">✕</button>
    </div>

    <section class="panel-section">
      <h3>인테리어 마감 & 뷰 제어</h3>
      <label class="toggle-row">
        <span>실내 천장 & 트랙 조명 표시</span>
        <input type="checkbox" id="toggle-ceiling" />
      </label>
      <div class="slider-row">
        <span>실내 조명 밝기 (Exposure)</span>
        <input type="range" id="slider-bloom" min="0.35" max="1.35" step="0.05" value="0.90" />
      </div>
      <label class="toggle-row">
        <span>CAD 도면 바닥선 겹쳐보기 (검수용)</span>
        <input type="checkbox" id="toggle-cad-overlay" />
      </label>
      <div class="slider-row">
        <span>도면 투명도</span>
        <input type="range" id="slider-cad-opacity" min="0" max="1" step="0.05" value="0.35" />
      </div>
      <label class="toggle-row">
        <span>외벽 반투명 모드 (외부에서 내부 투시)</span>
        <input type="checkbox" id="toggle-xray-walls" />
      </label>
      <div class="slider-row">
        <span>벽 높이 조절 (%)</span>
        <input type="range" id="slider-wall-height" min="15" max="100" step="5" value="100" />
      </div>
      <label class="toggle-row">
        <span>구역 이름표(라벨) 표시</span>
        <input type="checkbox" id="toggle-labels" />
      </label>
      <label class="toggle-row">
        <span>가구 / 오픈키친 설비 표시</span>
        <input type="checkbox" id="toggle-fixtures" checked />
      </label>
    </section>

    <section class="panel-section">
      <h3>시점 이동 & 보행 모드</h3>
      <label class="toggle-row">
        <span>클릭한 바닥으로 시점 순간이동 (더블클릭)</span>
        <input type="checkbox" id="toggle-click-move" checked />
      </label>
      <label class="toggle-row">
        <span>1인칭 사람 눈높이 모드 (1.65m 현장 보행)</span>
        <input type="checkbox" id="toggle-eye-level" />
      </label>
      <div class="nav-help-box">
        <div><strong>좌클릭 드래그:</strong> 360° 시점 회전</div>
        <div><strong>우클릭 드래그 / WASD:</strong> 보는 위치 이동</div>
        <div><strong>바닥 더블클릭:</strong> 그 자리로 순간이동</div>
      </div>
    </section>
  </aside>

  <!-- Right-Bottom On-Screen Navigation D-Pad -->
  <div class="nav-pad" id="nav-pad">
    <div class="nav-pad-title">위치 이동 패드</div>
    <div class="nav-pad-grid">
      <button class="nav-btn" data-move="up" title="위로 (Q)">▲ 높이</button>
      <button class="nav-btn" data-move="forward" title="앞으로 (W)">⬆ 전진</button>
      <button class="nav-btn" data-move="down" title="아래로 (E)">▼ 높이</button>
      <button class="nav-btn" data-move="left" title="왼쪽으로 (A)">⬅ 좌측</button>
      <button class="nav-btn" data-move="reset" title="중앙 초기화">● 조감뷰</button>
      <button class="nav-btn" data-move="right" title="오른쪽으로 (D)">➡ 우측</button>
      <div></div>
      <button class="nav-btn" data-move="backward" title="뒤로 (S)">⬇ 후진</button>
      <div></div>
    </div>
  </div>

  <!-- Bottom Tooltip / Selection Info -->
  <div id="selection-banner" class="selection-banner">
    상단 '🍷 1F 오픈키친 바' 버튼을 누르거나 원하는 바닥을 더블클릭해 화이트 테라조 바닥·화이트 페인트 벽·내추럴 오크 바 카운터 오픈키친 공간을 둘러보세요!
  </div>

  <!-- Floating Fullscreen UI Toggle Button (Always accessible when UI is hidden) -->
  <button id="floating-ui-toggle" class="floating-ui-toggle" title="메뉴 보기 / 숨기기">
    <span id="floating-toggle-icon">👁️</span>
    <span id="floating-toggle-text">UI 숨기기</span>
  </button>

  <script src="./static/js/cad_data.js?v=20261019_15"></script>
  <script type="module" src="./static/js/app.js?v=20261019_15"></script>
</body>
</html>
